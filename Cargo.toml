[package]
name = "webview-bridge-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "webview-bridge-rust"
path = "src/main.rs"

[lib]
name = "webview_bridge_rust"
path = "src/lib.rs"

[dependencies]
# HTTP Server
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Windows & WebView2
# バージョン不整合を完全に避けるため、webview2-com 0.19.1 が要求する
# windows v0.39.0 に、windows-implement v0.39.0 を明示的に組み合わせて
# グラフ内の windows-core 等を同一バージョンに強制する。
windows = { version = "0.39.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
] }
windows-implement = "0.39.0"
webview2-com = "0.19.1"

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
tempfile = "3.8"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

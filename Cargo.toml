[package]
name = "webview-bridge-rust"
version = "3.7.1"
edition = "2024"

[features]
default = ["server"]
server = [
    "dep:windows",
    "dep:windows-implement",
    "dep:webview2-com",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:futures",
    "dep:uuid",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tempfile",
    "dep:regex",
    "dep:rusqlite",
    "dep:rand",
]
cli = ["dep:clap"]

[[bin]]
name = "webview-bridge-rust"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "wb"
path = "src/cli/main.rs"
required-features = ["cli"]

[lib]
name = "webview_bridge_rust"
path = "src/lib.rs"

[dependencies]
# === Always available (shared by server & CLI) ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
urlencoding = "2.1"
chrono = "0.4"
dirs = "5.0"
toml = "0.8"
base64 = "0.21"

# === CLI only ===
clap = { version = "4", features = ["derive", "env"], optional = true }

# === Server only (gated behind "server" feature) ===
# HTTP Server
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
futures = { version = "0.3", optional = true }

# Windows & WebView2
windows = { version = "0.39.0", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
    "Win32_UI_Shell",
    "Win32_System_Com_StructuredStorage",
] }
windows-implement = { version = "0.39.0", optional = true }
webview2-com = { version = "0.19.1", optional = true }

# Utils (server only)
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tempfile = { version = "3.8", optional = true }
regex = { version = "1.10", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
rand = { version = "0.8", optional = true }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
axum-test = "14"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"

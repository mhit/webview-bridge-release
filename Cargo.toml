[package]
name = "webview-bridge-rust"
version = "3.14.2"
edition = "2024"

[features]
default = ["server"]
server = [
    "dep:windows",
    "dep:windows-implement",
    "dep:webview2-com",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:futures",
    "dep:uuid",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:tempfile",
    "dep:regex",
    "dep:rusqlite",
    "dep:rand",
]
cli = ["dep:clap"]

[[bin]]
name = "webview-bridge-rust"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "wb"
path = "src/cli/main.rs"
required-features = ["cli"]

[lib]
name = "webview_bridge_rust"
path = "src/lib.rs"

[dependencies]
# === Always available (shared by server & CLI) ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
urlencoding = "2.1"
chrono = "0.4"
dirs = "5.0"
toml = "0.8"
base64 = "0.21"

# === CLI only ===
clap = { version = "4", features = ["derive", "env"], optional = true }

# === Server only (gated behind "server" feature) ===
# HTTP Server
axum = { version = "0.7", features = ["ws", "multipart"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
futures = { version = "0.3", optional = true }

# Windows & WebView2
windows = { version = "0.39.0", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
    "Win32_UI_Shell",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
] }
windows-implement = { version = "0.39.0", optional = true }
webview2-com = { version = "0.19.1", optional = true }

# Utils (server only)
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2", optional = true }
tempfile = { version = "3.8", optional = true }
regex = { version = "1.10", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
rand = { version = "0.8", optional = true }

[lints.clippy]
# These lints produce false positives or pedantic warnings in this codebase.
# Suppressed globally to keep CI green across Rust versions.
collapsible_if = "allow"
type_complexity = "allow"
empty_line_after_doc_comments = "allow"
empty_line_after_outer_attr = "allow"
unnecessary_unwrap = "allow"
useless_format = "allow"
redundant_pattern_matching = "allow"
wildcard_in_or_patterns = "allow"
should_implement_trait = "allow"
manual_pattern_char_comparison = "allow"
needless_borrow = "allow"
manual_filter_map = "allow"
option_as_ref_deref = "allow"
let_and_return = "allow"
map_unwrap_or = "allow"
derivable_impls = "allow"
manual_flatten = "allow"
single_match = "allow"
needless_borrows_for_generic_args = "allow"
manual_range_contains = "allow"
field_reassign_with_default = "allow"
useless_conversion = "allow"
unnecessary_cast = "allow"
manual_dangling_ptr = "allow"
missing_const_for_thread_local = "allow"
redundant_closure = "allow"
too_many_arguments = "allow"
ptr_arg = "allow"
unnecessary_lazy_evaluations = "allow"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
axum-test = "14"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"

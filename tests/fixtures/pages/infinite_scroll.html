<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限スクロールテスト</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .item {
            background: #f5f5f5;
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        .item-image {
            width: 80px;
            height: 80px;
            background: #ddd;
            border-radius: 4px;
            margin-right: 15px;
        }

        .item-content h3 {
            margin: 0 0 5px 0;
        }

        .item-content p {
            margin: 0;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        #item-count {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #007bff;
            color: white;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>商品一覧</h1>
    <div id="item-count">アイテム数: <span id="count">0</span></div>
    <div id="items-container"></div>
    <div class="loading" id="loading">読み込み中...</div>

    <script>
        let itemCount = 0;
        let loading = false;
        const maxItems = 100;

        function createItem(index) {
            return `
                <div class="item" data-id="${index}">
                    <div class="item-image product-image"></div>
                    <div class="item-content">
                        <h3 class="product-name">商品 ${index}</h3>
                        <p class="product-price">¥${(Math.random() * 10000).toFixed(0)}</p>
                        <p class="product-stock">${Math.random() > 0.3 ? '在庫あり' : '在庫なし'}</p>
                    </div>
                </div>
            `;
        }

        function loadMoreItems() {
            if (loading || itemCount >= maxItems) return;
            loading = true;

            setTimeout(() => {
                const container = document.getElementById('items-container');
                const fragment = document.createDocumentFragment();
                const tempDiv = document.createElement('div');

                for (let i = 0; i < 10 && itemCount < maxItems; i++) {
                    itemCount++;
                    tempDiv.innerHTML = createItem(itemCount);
                    fragment.appendChild(tempDiv.firstElementChild);
                }

                container.appendChild(fragment);
                document.getElementById('count').textContent = itemCount;

                if (itemCount >= maxItems) {
                    document.getElementById('loading').style.display = 'none';
                }

                loading = false;
            }, 500);
        }

        // Initial load
        loadMoreItems();

        // Infinite scroll
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
                loadMoreItems();
            }
        });
    </script>
</body>

</html>
